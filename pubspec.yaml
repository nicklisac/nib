name: nib
description: A minimalist terminal CLI coding agent in Dart (inspired by Pi and Tau).
version: 0.2.8
repository: https://github.com/nicklisac/nib

executables:
  nib: nib

environment:
  sdk: ^3.11.5

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  characters: ^1.4.1
  dart_console: ^5.1.0
  diffutil_dart: ^5.0.0
  html: ^0.15.7
  http: ^1.6.0
  image: ^4.10.1
  path: ^1.9.1
  val_highlight: ^0.1.0
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
